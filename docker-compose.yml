services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adaptive-carbon-orchestrator
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6JRAoY_zTEJtVhCA9EEwiNqMVAAfmW0J96qbleVFXi7bQ}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
